name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: solens-app
  INSTANCE_ID: i-030cad54ba7522fc3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (for arm64 cross-build; the EC2 instance is Graviton/t4g)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # :v1 matches the tag the running container already pulls on restart;
          # the sha tag gives a rollback target without touching the box.
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:v1
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_PRIVY_LOGIN_METHODS=${{ vars.NEXT_PUBLIC_PRIVY_LOGIN_METHODS }}
            NEXT_PUBLIC_ENABLE_PRIVY_EMBEDDED_WALLETS=${{ vars.NEXT_PUBLIC_ENABLE_PRIVY_EMBEDDED_WALLETS }}
            NEXT_PUBLIC_SOLANA_RPC_URL=${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No SSH key exists on the instance — every prior manual deploy went
      # through SSM Session Manager, so redeploy does too. The container is
      # recreated with the SAME network/restart-policy/env-file the running
      # one already uses; app secrets stay in /opt/solens/.env on the box and
      # never touch GitHub.
      - name: Redeploy container via SSM
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:v1"
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy solens-app ${{ github.sha }}" \
            --parameters "commands=[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}\",
              \"docker pull $IMAGE\",
              \"docker stop solens-app || true\",
              \"docker rm solens-app || true\",
              \"docker run -d --name solens-app --network solens --restart always --env-file /opt/solens/.env $IMAGE\",
              \"sleep 5\",
              \"docker ps --filter name=solens-app --filter status=running --format '{{.Names}} {{.Status}}'\",
              \"docker ps --filter name=solens-app --filter status=running -q | grep -q . && echo DEPLOY_OK || (echo DEPLOY_FAILED_CONTAINER_NOT_RUNNING; exit 1)\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll until the command finishes (SSM has no native "wait" for RunCommand).
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --region ${{ env.AWS_REGION }} \
              --instance-id ${{ env.INSTANCE_ID }} \
              --command-id "$COMMAND_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --region ${{ env.AWS_REGION }} \
            --instance-id ${{ env.INSTANCE_ID }} \
            --command-id "$COMMAND_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed (SSM status: $STATUS)"
            exit 1
          fi
